<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Willekeurige Gerechten</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 font-sans text-slate-800 min-h-screen flex flex-col items-center py-10 px-4 print:bg-white print:py-0">

<div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-2xl text-center print:shadow-none print:max-w-full mb-8">
    <h1 class="text-3xl font-extrabold text-slate-900 mb-6">Willekeurige Gerechten</h1>
    
    <div class="space-x-2 mb-6 print:hidden">
        <button id="haal-recept" class="bg-green-600 hover:bg-green-700 text-white font-bold py-2 px-6 rounded-lg transition-colors duration-200 shadow-md">
            Geef een gerecht
        </button>
        <button id="print-recept" class="hidden bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-6 rounded-lg transition-colors duration-200 shadow-md">
            Print
        </button>
        <button id="opslaan-recept" class="hidden bg-yellow-500 hover:bg-yellow-600 text-white font-bold py-2 px-6 rounded-lg transition-colors duration-200 shadow-md">
            Bewaar
        </button>
    </div>
    
    <div id="recept" class="text-lg">Klik op de knop voor een verrassing.</div>
</div>

<div id="favorieten-container" class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-2xl hidden print:hidden">
    <h2 class="text-2xl font-bold text-slate-900 mb-4 border-b border-slate-200 pb-2">Opgeslagen Favorieten</h2>
    <ul id="favorieten-lijst" class="space-y-3 text-left"></ul>
</div>

<script>
const knop = document.getElementById('haal-recept');
const printKnop = document.getElementById('print-recept');
const opslaanKnop = document.getElementById('opslaan-recept');
const receptDiv = document.getElementById('recept');
const favorietenContainer = document.getElementById('favorieten-container');
const favorietenLijst = document.getElementById('favorieten-lijst');

let favorieten = JSON.parse(localStorage.getItem('favorieteRecepten')) || [];
let huidigReceptData = null;

function toonFavorieten() {
    if (favorieten.length > 0) {
        favorietenContainer.classList.remove('hidden');
        favorietenLijst.innerHTML = '';
        favorieten.forEach((fav, index) => {
            favorietenLijst.innerHTML += `
                <li class="flex justify-between items-center bg-slate-50 p-3 rounded border border-slate-200">
                    <span class="font-semibold text-slate-800">${fav.titel}</span>
                    <button onclick="verwijderFavoriet(${index})" class="text-red-500 hover:text-red-700 font-bold px-2 py-1">Verwijder</button>
                </li>
            `;
        });
    } else {
        favorietenContainer.classList.add('hidden');
    }
}

window.verwijderFavoriet = function(index) {
    favorieten.splice(index, 1);
    localStorage.setItem('favorieteRecepten', JSON.stringify(favorieten));
    toonFavorieten();
};

toonFavorieten();

printKnop.addEventListener('click', () => {
    window.print();
});

opslaanKnop.addEventListener('click', () => {
    if (huidigReceptData) {
        let bestaatAl = favorieten.some(f => f.titel === huidigReceptData.titel);
        if (!bestaatAl) {
            favorieten.push(huidigReceptData);
            localStorage.setItem('favorieteRecepten', JSON.stringify(favorieten));
            toonFavorieten();
            opslaanKnop.textContent = "Opgeslagen!";
            opslaanKnop.classList.replace('bg-yellow-500', 'bg-slate-400');
            opslaanKnop.classList.replace('hover:bg-yellow-600', 'hover:bg-slate-500');
            opslaanKnop.disabled = true;
        }
    }
});

function berekenBreuk(waarde) {
    let delen = waarde.trim().split(" ");
    let totaal = 0;
    for (let i = 0; i < delen.length; i++) {
        let deel = delen[i];
        if (deel.includes('/')) {
            let breuk = deel.split('/');
            if (!isNaN(breuk[0]) && !isNaN(breuk[1])) {
                totaal += parseFloat(breuk[0]) / parseFloat(breuk[1]);
            }
        } else if (!isNaN(deel)) {
            totaal += parseFloat(deel);
        }
    }
    return totaal || 0;
}

function converteerNaarMetrisch(maat) {
    if (!maat) return maat;
    let vertaaldeMaat = maat.toLowerCase();

    const ozMatch = vertaaldeMaat.match(/([\d\s\.\/]+)\s*oz/);
    if (ozMatch) {
        const getal = berekenBreuk(ozMatch[1]);
        if (getal > 0) {
            const grammen = Math.round(getal * 28.35);
            return vertaaldeMaat.replace(ozMatch[0], grammen + " gram");
        }
    }

    const cupMatch = vertaaldeMaat.match(/([\d\s\.\/]+)\s*cup/);
    if (cupMatch) {
        const getal = berekenBreuk(cupMatch[1]);
        if (getal > 0) {
            const ml = Math.round(getal * 240);
            return vertaaldeMaat.replace(cupMatch[0], ml + " ml");
        }
    }

    const lbMatch = vertaaldeMaat.match(/([\d\s\.\/]+)\s*lb/);
    if (lbMatch) {
        const getal = berekenBreuk(lbMatch[1]);
        if (getal > 0) {
            const grammen = Math.round(getal * 453.59);
            return vertaaldeMaat.replace(lbMatch[0], grammen + " gram");
        }
    }

    return vertaaldeMaat;
}

async function vertaal(tekst) {
    if (!tekst) return "";
    try {
        let res = await fetch("https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=nl&dt=t&q=" + encodeURIComponent(tekst));
        let json = await res.json();
        let vertaling = "";
        for (let i = 0; i < json[0].length; i++) {
            vertaling += json[0][i][0];
        }
        return vertaling;
    } catch (e) {
        return tekst;
    }
}

knop.addEventListener('click', async () => {
    receptDiv.innerHTML = '<div class="animate-pulse flex space-x-4 justify-center items-center py-10"><div class="rounded-full bg-slate-300 h-10 w-10"></div><div class="flex-1 space-y-6 py-1 max-w-sm"><div class="h-2 bg-slate-300 rounded"></div><div class="space-y-3"><div class="grid grid-cols-3 gap-4"><div class="h-2 bg-slate-300 rounded col-span-2"></div><div class="h-2 bg-slate-300 rounded col-span-1"></div></div><div class="h-2 bg-slate-300 rounded"></div></div></div></div><p class="text-slate-500 mt-4 text-sm font-medium">Chefkok is aan het vertalen... 🍳</p>';
    printKnop.classList.add('hidden');
    opslaanKnop.classList.add('hidden');
    
    opslaanKnop.textContent = "Bewaar";
    opslaanKnop.classList.replace('bg-slate-400', 'bg-yellow-500');
    opslaanKnop.classList.replace('hover:bg-slate-500', 'hover:bg-yellow-600');
    opslaanKnop.disabled = false;

    try {
        const response = await fetch('https://www.themealdb.com/api/json/v1/1/random.php');
        const data = await response.json();
        const gerecht = data.meals[0];

        let vertaalPromises = [];
        vertaalPromises.push(vertaal(gerecht.strMeal));
        vertaalPromises.push(vertaal(gerecht.strCategory));
        vertaalPromises.push(vertaal(gerecht.strArea));
        vertaalPromises.push(vertaal(gerecht.strInstructions));

        let ingredientenLijst = [];
        for (let i = 1; i <= 20; i++) {
            const ingredient = gerecht[`strIngredient${i}`];
            const hoeveelheid = gerecht[`strMeasure${i}`];
            if (ingredient && ingredient.trim() !== "") {
                let metrischeHoeveelheid = converteerNaarMetrisch(hoeveelheid);
                ingredientenLijst.push(true);
                vertaalPromises.push(vertaal(metrischeHoeveelheid));
                vertaalPromises.push(vertaal(ingredient));
            }
        }

        let resultaten = await Promise.all(vertaalPromises);

        let titelNL = resultaten[0];
        let categorieNL = resultaten[1];
        let keukenNL = resultaten[2];
        let instructiesNL = resultaten[3];

        huidigReceptData = {
            titel: titelNL,
            id: gerecht.idMeal
        };

        let ingredientenHTML = '<div class="text-left bg-slate-50 p-6 rounded-xl mt-6 border border-slate-100 shadow-sm"><h3 class="text-xl font-bold text-slate-800 mb-4 border-b pb-2">Ingrediënten</h3><ul class="list-disc pl-5 space-y-2 text-slate-600">';
        
        let offset = 4;
        for (let i = 0; i < ingredientenLijst.length; i++) {
            let vertaaldeHoeveelheid = resultaten[offset];
            let vertaaldIngredient = resultaten[offset + 1];
            ingredientenHTML += `<li><strong class="text-slate-800">${vertaaldeHoeveelheid}</strong> ${vertaaldIngredient}</li>`;
            offset += 2;
        }
        ingredientenHTML += '</ul></div>';

        let instructiesOpgemaakt = instructiesNL.replace(/\n/g, '<br><br>');
        let instructiesHTML = `<div class="text-left bg-slate-100 p-6 rounded-xl mt-6 border border-slate-200"><h3 class="text-xl font-bold text-slate-800 mb-4 border-b border-slate-300 pb-2">Bereidingswijze</h3><p class="text-slate-700 leading-relaxed">${instructiesOpgemaakt}</p></div>`;

        receptDiv.innerHTML = `
            <h2 class="text-2xl md:text-3xl font-bold text-slate-900 mt-4 mb-2">${titelNL}</h2>
            <div class="flex justify-center mb-4">
                <span class="bg-green-100 text-green-800 text-xs font-semibold px-2.5 py-0.5 rounded mr-2">Categorie: ${categorieNL}</span>
                <span class="bg-blue-100 text-blue-800 text-xs font-semibold px-2.5 py-0.5 rounded">Keuken: ${keukenNL}</span>
            </div>
            <img src="${gerecht.strMealThumb}" alt="${titelNL}" class="w-full max-w-sm mx-auto rounded-xl shadow-lg my-6 object-cover aspect-square">
            
            ${ingredientenHTML}
            ${instructiesHTML}
            
            <a href="${gerecht.strSource ? gerecht.strSource : gerecht.strYoutube}" target="_blank" class="inline-block mt-8 px-6 py-3 bg-slate-800 hover:bg-slate-900 text-white font-bold rounded-lg shadow-md transition-colors duration-200 print:hidden">
                Bekijk Originele Bron
            </a>
        `;
        
        printKnop.classList.remove('hidden');
        opslaanKnop.classList.remove('hidden');
        
    } catch (error) {
        receptDiv.innerHTML = '<div class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded relative mt-4" role="alert"><strong class="font-bold">Oeps!</strong><span class="block sm:inline"> Er ging iets mis in de keuken. Probeer het opnieuw.</span></div>';
        console.error(error);
    }
});
</script>

</body>
</html>
